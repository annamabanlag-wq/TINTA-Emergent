<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131a"><title>TULONG PH — Real help. One bridge.</title><link rel="manifest" href="/manifest.webmanifest"></head>
<body>
<div id="app"></div>
<script>
const CATS=[["🏥","Medical"],["♿","Disability"],["👨‍👩‍👧","Family"],["🕯️","Bereavement"],["🐾","Pets"],["🎓","Education"]];
const seed=[
{id:"c1",title:"Help Mara complete her leukemia treatment",category:"Medical",city:"Quezon City",beneficiary:"Mara C.",raised:185400,goal:300000,donors:127,verified:true,tone:"medical",copy:"Support Mara’s family with treatment, medicines, laboratory work and transport while she continues her care."},
{id:"c2",title:"A wheelchair and safer home for Jun",category:"Disability",city:"Cebu City",beneficiary:"Jun R.",raised:72400,goal:120000,donors:83,verified:true,tone:"disability",copy:"A community fundraiser for mobility equipment and basic home improvements that make everyday life safer."},
{id:"c3",title:"Keep the Santos family together after the fire",category:"Family",city:"Pasig",beneficiary:"Santos Family",raised:49850,goal:100000,donors:61,verified:true,tone:"family",copy:"Emergency support for temporary shelter, food, school needs and replacing essential belongings."},
{id:"c4",title:"Funeral assistance for a father of four",category:"Bereavement",city:"Iloilo City",beneficiary:"Dela Cruz Family",raised:91800,goal:130000,donors:104,verified:true,tone:"bereavement",copy:"Help the family cover funeral and burial costs while they navigate the loss of their main provider."},
{id:"c5",title:"Save Luna’s life and pay for surgery",category:"Pets",city:"Davao City",beneficiary:"Luna",raised:38100,goal:65000,donors:52,verified:true,tone:"pets",copy:"A rescue dog needs urgent surgery and aftercare. Every donation helps with veterinary treatment and recovery."},
{id:"c6",title:"School supplies and tuition for 3 siblings",category:"Education",city:"Antipolo",beneficiary:"Garcia Siblings",raised:62100,goal:90000,donors:75,verified:true,tone:"education",copy:"Help three siblings stay in school with tuition, uniforms, books and transportation support."}
];
let DATA=seed,cat="All",q="";
const peso=n=>"₱"+Number(n).toLocaleString("en-PH"), pct=c=>Math.min(100,Math.round(c.raised/c.goal*100));
function card(c){return `<article class="card"><button class="media ${c.tone}" onclick="go('campaign', '${c.id}')"><span class="label">${c.category}</span><span class="media-glow"></span></button><div class="pad"><div class="toprow"><span class="verified">✓ VERIFIED</span><span class="muted">${c.city}</span></div><h3>${c.title}</h3><div class="muted">For ${c.beneficiary}</div><p>${c.copy}</p><div class="bar"><i style="width:${pct(c)}%"></i></div><div class="statrow"><b>${peso(c.raised)}</b><span>${pct(c)}% of ${peso(c.goal)}</span></div><div class="muted" style="margin-top:8px">${c.donors} donors</div></div></article>`}
function shell(active,body){document.querySelector("#app").innerHTML=`<header><div class="nav"><a class="brand" onclick="go('home')"><span class="mark">+</span>TULONG PH</a><nav><a class="${active==='home'?'active':''}" onclick="go('home')">Discover</a><a onclick="go('home');setTimeout(()=>document.querySelector('#categories')?.scrollIntoView(),50)">Categories</a><a onclick="go('home');setTimeout(()=>document.querySelector('#how')?.scrollIntoView(),50)">How it works</a><a onclick="go('home');setTimeout(()=>document.querySelector('#sponsor')?.scrollIntoView(),50)">Sponsors</a></nav><div class="navactions"><a class="btn soft" onclick="go('dashboard')">Dashboard</a><a class="btn dark" onclick="go('create')">Start a fundraiser</a></div></div></header>${body}<footer><div class="foot"><div><div class="brand inv"><span class="mark">+</span>TULONG PH</div><p>A premium community bridge for Filipinos helping Filipinos.</p></div><div><b>Platform</b><a onclick="go('home')">Discover</a><a onclick="go('create')">Start a fundraiser</a></div><div><b>Trust</b><a onclick="go('admin')">Admin review</a><a href="#how">Verification</a></div><div><b>Partners</b><a href="mailto:hello@tulong.ph">Advertise</a><a href="mailto:hello@tulong.ph">Contact</a></div></div></footer>`}
function home(){shell("home",`<main><section class="hero"><div class="container heroGrid"><div><span class="eyebrow"><i></i> BUILT FOR FILIPINOS HELPING FILIPINOS</span><h1>One community.<br><em>Real help.</em><br>One bridge.</h1><p class="lead">TULONG PH connects people who need a helping hand with people who are ready to give. Discover fundraisers, share a story, and help someone move forward.</p><div class="actions"><button class="btn accent" onclick="document.querySelector('#discover').scrollIntoView()">Find a fundraiser →</button><button class="btn soft" onclick="go('create')">Start a fundraiser</button></div><div class="proof"><div><b>₱2.8M+</b>community demo volume</div><span></span><div><b>24/7</b>campaign discovery</div><span></span><div><b>✓</b>verification-first</div></div></div><div class="feature"><div class="featureTop"><small>FEATURED COMMUNITY STORY</small><span class="verified">✓ VERIFIED</span></div><div class="featureStory"><small>MEDICAL · QUEZON CITY</small><h2>Help Mara finish the treatment that gives her family more time.</h2><p>Every share can reach someone who can help with the next hospital bill, medicine refill or laboratory test.</p><div class="featureBar"><i></i></div><div class="featureStats"><b>₱185,400 raised</b><span>62% of ₱300,000</span></div></div></div></div></section><section id="categories" class="section"><div class="container"><div class="head"><div><h2>Find help by category</h2><p>Start with the situation that matters to you.</p></div></div><div class="cats">${CATS.map(c=>`<button onclick="cat='${c[1]}';document.querySelector('#discover').scrollIntoView();renderList()"><span>${c[0]}</span>${c[1]}</button>`).join("")}</div></div></section><section id="discover" class="section"><div class="container"><div class="head"><div><h2>Fundraisers people are rallying behind</h2><p>Stories from communities across the Philippines.</p></div><a onclick="go('create')" class="textlink">Need help? Start here →</a></div><div class="toolbar"><label class="search">⌕<input id="search" placeholder="Search by story, city, or person"></label><div class="chips"><button class="chip active" data-cat="All">All</button>${CATS.map(c=>`<button class="chip" data-cat="${c[1]}">${c[1]}</button>`).join("")}</div></div><div class="grid" id="list"></div></div></section><section id="how" class="section"><div class="container"><div class="head"><div><h2>Trust is part of the product</h2><p>Verification and transparent updates sit beside the fundraising experience.</p></div></div><div class="trust"><div><b>01</b><h3>Campaign review</h3><p>Submissions can be reviewed with supporting documents before a campaign receives a Verified badge.</p></div><div><b>02</b><h3>Visible progress</h3><p>Donors see the target, amount raised, donor count, updates and campaign status in one place.</p></div><div><b>03</b><h3>Report & moderate</h3><p>Every campaign can be reported and managed through a dedicated admin workflow.</p></div></div></div></section><section class="container"><div class="cta" id="sponsor"><div><h2>Companies can amplify good.</h2><p>Responsible sponsored stories, promotional videos and advertising can support the platform.</p></div><a class="btn accent" href="mailto:hello@tulong.ph">Partner with us</a></div></section></main>`);renderList();document.querySelector("#search").oninput=e=>{q=e.target.value;renderList()};document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x===b));renderList()})}
function renderList(){const el=document.querySelector("#list");if(!el)return;const s=q.toLowerCase();const arr=DATA.filter(c=>(cat==="All"||c.category===cat)&&(`${c.title} ${c.city} ${c.beneficiary}`).toLowerCase().includes(s));el.innerHTML=arr.length?arr.map(card).join(""):`<div class="empty">No fundraisers matched that search.</div>`}
function create(){shell("",`<main class="page"><div class="container"><div class="head"><div><h1>Start a fundraiser</h1><p>Tell your story clearly. Campaigns can be reviewed before verification.</p></div></div><div class="panel"><div class="notice">Demo mode: identity evidence, payout controls and live donation processing are not connected yet.</div><form id="form"><div class="formgrid"><label>Fundraiser title<input name="title" required placeholder="Help Ana with her hospital treatment"></label><label>Category<select name="category">${CATS.map(c=>`<option>${c[1]}</option>`).join("")}</select></label><label>City / Province<input name="city" required placeholder="Quezon City"></label><label>Beneficiary<input name="beneficiary" required placeholder="Full name or family"></label><label>Goal (PHP)<input name="goal" type="number" min="100" required placeholder="100000"></label><label class="full">Story<textarea name="copy" required placeholder="Explain what happened, what the funds are for, and how people can help."></textarea></label></div><div class="actions"><button class="btn dark" type="submit">Submit for review</button><span id="msg" class="muted"></span></div></form></div></div></main>`);document.querySelector("#form").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const r=await fetch("/api/campaigns",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(d)});if(r.ok){const c=await r.json();DATA.unshift(c);document.querySelector("#msg").textContent="Submitted. Your campaign is now pending review.";e.target.reset()}else document.querySelector("#msg").textContent="Please check the form."}}
function dashboard(){shell("",`<main class="page"><div class="container"><div class="head"><div><h1>Your dashboard</h1><p>Manage campaigns, verification and updates.</p></div><button class="btn accent" onclick="go('create')">+ New fundraiser</button></div><div class="metrics"><div><small>Campaigns</small><b id="m1"></b></div><div><small>Total raised</small><b id="m2"></b></div><div><small>Donors</small><b id="m3"></b></div><div><small>Verified</small><b id="m4"></b></div></div><div class="panel"><h2>Campaigns</h2><div id="rows" class="rows"></div></div></div></main>`);document.querySelector("#m1").textContent=DATA.length;document.querySelector("#m2").textContent=peso(DATA.reduce((s,c)=>s+c.raised,0));document.querySelector("#m3").textContent=DATA.reduce((s,c)=>s+c.donors,0);document.querySelector("#m4").textContent=DATA.filter(c=>c.verified).length;document.querySelector("#rows").innerHTML=DATA.map(c=>`<div class="row"><div><b>${c.title}</b><small>${c.city} · ${peso(c.raised)} raised</small></div><span class="status ${c.verified?'ok':'pend'}">${c.verified?'VERIFIED':'PENDING REVIEW'}</span></div>`).join("")}
function admin(){shell("",`<main class="page"><div class="container"><div class="head"><div><h1>Admin command center</h1><p>Moderate campaigns, verify evidence and monitor reports.</p></div><span class="status pend">DEMO ADMIN MODE</span></div><div class="metrics"><div><small>Pending review</small><b>${DATA.filter(c=>!c.verified).length}</b></div><div><small>Verified</small><b>${DATA.filter(c=>c.verified).length}</b></div><div><small>Fundraising volume</small><b>${peso(DATA.reduce((s,c)=>s+c.raised,0))}</b></div><div><small>Reports</small><b>0</b></div></div><div class="panel"><h2>Campaign review queue</h2><div class="rows">${DATA.map(c=>`<div class="row"><div><b>${c.title}</b><small>${c.category} · ${c.city} · goal ${peso(c.goal)}</small></div><span class="status ${c.verified?'ok':'pend'}">${c.verified?'VERIFIED':'PENDING'}</span></div>`).join("")}</div></div></div></main>`)}
function campaign(id){const c=DATA.find(x=>x.id===id)||DATA[0];shell("",`<main class="page"><div class="container"><a class="textlink" onclick="go('home')">← Back to fundraisers</a><div class="detail"><div class="panel"><div class="media ${c.tone}" style="height:330px"></div><div class="pad"><span class="verified">✓ VERIFIED</span><h1>${c.title}</h1><div class="muted">For ${c.beneficiary} · ${c.city}</div><p class="bigcopy">${c.copy}</p><h3>Campaign details</h3><p class="muted">In production, this space will contain the full verified story, supporting evidence, updates and transparent fund-use reports.</p></div></div><aside class="panel sticky"><small>COMMUNITY FUNDRAISER</small><h2>${peso(c.raised)}</h2><div class="muted">raised of ${peso(c.goal)}</div><div class="bar"><i style="width:${pct(c)}%"></i></div><div class="statrow"><b>${pct(c)}%</b><span>${c.donors} donors</span></div><button class="btn accent wide" onclick="alert('Donation checkout is in demo mode. Connect a compliant Philippine payment provider for production.')">Donate now</button><button class="btn soft wide" onclick="navigator.clipboard?.writeText(location.href);this.textContent='Link copied'">Share this fundraiser</button><div class="notice">Real-money donations, payouts and verification are deliberately disabled until the production controls are connected.</div></aside></div></div></main>`)}
function go(view,id){history.pushState({}, "", view==="home"?"/":"/"+view+(id?"/"+id:""));if(view==="home")home();if(view==="create")create();if(view==="dashboard")dashboard();if(view==="admin")admin();if(view==="campaign")campaign(id)}
window.onpopstate=()=>{const p=location.pathname.split("/").filter(Boolean);if(!p.length)home();else if(p[0]==="create")create();else if(p[0]==="dashboard")dashboard();else if(p[0]==="admin")admin();else if(p[0]==="campaign")campaign(p[1])}; home();
</script>
<style>

color:#686f7b;max-width:650px}.actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:24px}.proof{display:flex;align-items:center;gap:18px;margin-top:28px;color:#7a808b;font-size:11px}.proof b{display:block;font-size:20px;color:var(--ink)}.proof>span{height:31px;width:1px;background:var(--line)}.feature{min-height:420px;border-radius:28px;background:linear-gradient(145deg,#12161d,#252e3a);color:#fff;padding:24px;position:relative;overflow:hidden;box-shadow:var(--shadow)}.feature:before{content:'';position:absolute;width:330px;height:330px;background:rgba(232,93,63,.18);border-radius:50%;right:-150px;top:-120px}.featureTop{display:flex;justify-content:space-between;position:relative;z-index:1;font-size:10px;color:#c1c6cf}.verified{display:inline-block;color:#2b7658;background:#ebf8f2;border:1px solid #d1f0e2;padding:6px 8px;border-radius:8px;font-size:9px;font-weight:900}.feature .verified{color:#a3efcb;background:rgba(42,143,104,.15);border-color:rgba(103,221,173,.2)}.featureStory{position:relative;z-index:1;margin-top:115px;max-width:430px}.featureStory>small{color:#aeb5c0}.featureStory h2{font-size:29px;line-height:1.08;letter-spacing:-.04em;margin:7px 0 10px}.featureStory p{color:#c8cdd5;line-height:1.55;font-size:13px}.featureBar,.bar{height:8px;background:#eef0f4;border-radius:999px;overflow:hidden}.featureBar{background:rgba(255,255,255,.12);margin-top:18px}.featureBar i,.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#ff8c68,#ffb963)}.featureBar i{width:62%}.featureStats,.statrow{display:flex;justify-content:space-between;align-items:end;margin-top:9px;font-size:11px}.featureStats{color:#c6cbd3}.featureStats b{color:#fff}.section{padding:46px 0}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.head h1,.head h2{font-size:33px;letter-spacing:-.045em;margin:0}.head p{margin:7px 0 0;color:var(--muted)}.textlink{font-size:13px;color:#874737;font-weight:900}.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.cats button{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px 10px;font-weight:850;box-shadow:0 7px 24px rgba(16,24,40,.04)}.cats span{display:grid;place-items:center;background:#f4f5f7;border-radius:14px;width:42px;height:42px;margin:0 auto 9px;font-size:20px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}.search{flex:1;min-width:240px;display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 14px;color:#9096a1}.search input{width:100%;border:0;outline:0;padding:13px 0;background:transparent}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 13px;font-size:11px;font-weight:850;color:#6b717c}.chip.active{border-color:#222730;color:#222730}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 8px 26px rgba(16,24,40,.05)}.media{border:0;width:100%;height:185px;background:linear-gradient(135deg,#d8d3cd,#efebe6);position:relative;overflow:hidden}.media:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 70% 25%,rgba(255,255,255,.55),transparent 27%),linear-gradient(145deg,transparent,rgba(20,25,32,.12))}.media.medical{background:linear-gradient(145deg,#c8d9e4,#f1efec)}.media.disability{background:linear-gradient(145deg,#c6cbe0,#ececf2)}.media.family{background:linear-gradient(145deg,#e4c7b8,#f7ebdf)}.media.bereavement{background:linear-gradient(145deg,#b8bac3,#ebedf0)}.media.pets{background:linear-gradient(145deg,#cbd9c3,#eef1dd)}.media.education{background:linear-gradient(145deg,#f1dba6,#f8f0d7)}.label{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92);border-radius:9px;padding:7px 9px;color:#343841;font-size:10px;font-weight:900}.pad{padding:16px}.toprow{display:flex;justify-content:space-between;align-items:center}.muted{color:#858b96;font-size:11px}.card h3{font-size:18px;line-height:1.18;letter-spacing:-.025em;margin:10px 0 6px}.card p{color:#707681;font-size:13px;line-height:1.55;margin:11px 0 14px}.bar{margin-top:9px}.bar i{background:linear-gradient(90deg,#ef7654,#e85d3f)}.statrow span{color:#858b96}.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.trust>div{background:#fff;border:1px solid var(--line);border-radius:20px;padding:21px}.trust b{display:grid;place-items:center;width:38px;height:38px;background:#f4f5f7;border-radius:12px;margin-bottom:13px}.trust h3{font-size:17px;margin:0 0 7px}.trust p{margin:0;color:#747a85;font-size:13px;line-height:1.55}.cta{margin:52px 0 70px;background:linear-gradient(130deg,#141820,#242d38);color:#fff;border-radius:28px;padding:36px;display:flex;justify-content:space-between;align-items:center;gap:20px}.cta h2{font-size:32px;letter-spacing:-.05em;margin:0 0 7px}.cta p{color:#c2c7d0;max-width:720px;line-height:1.55;margin:0}footer{background:#11141a;color:#8f96a2;padding:43px 0}.foot{width:min(1180px,calc(100% - 30px));margin:auto;display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:28px}.foot b{color:#fff;font-size:12px}.foot a{display:block;margin-top:9px;font-size:12px}.foot p{font-size:12px;line-height:1.6;max-width:330px}.inv{color:#fff}.page{padding:44px 0 75px}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow)}.notice{background:#fff5ee;color:#865342;border:1px solid #ffe0cf;border-radius:14px;padding:12px 13px;font-size:12px;line-height:1.55;margin-bottom:17px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formgrid label{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:850;color:#454a53}.formgrid .full{grid-column:1/-1}.formgrid input,.formgrid textarea,.formgrid select{border:1px solid var(--line);background:#fbfbfc;border-radius:13px;padding:12px;outline:0}.formgrid textarea{min-height:150px;resize:vertical}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.metric{background:#fff}.metrics>div{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.metrics small{display:block;color:#818792;font-size:11px}.metrics b{display:block;font:800 26px Manrope,system-ui;margin-top:7px}.rows{display:grid;gap:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:15px}.row b{display:block;font-size:13px}.row small{display:block;margin-top:4px;color:#838995;font-size:11px}.status{border-radius:999px;padding:7px 9px;font-size:9px;font-weight:900;white-space:nowrap}.status.ok{color:#267457;background:#eaf7f1}.status.pend{color:#8b651d;background:#fff3dc}.detail{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-top:24px}.sticky{height:fit-content;position:sticky;top:95px}.sticky h2{font:800 34px Manrope;margin:6px 0}.wide{width:100%;margin-top:10px}.bigcopy{font-size:16px;line-height:1.7;color:#606773}.empty{grid-column:1/-1;background:#fff;border:1px dashed #d7d9df;border-radius:20px;padding:45px;text-align:center;color:#7e848f}@media(max-width:980px){nav{display:none}.heroGrid,.detail{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.cats{grid-template-columns:repeat(3,1fr)}.trust{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.foot{grid-template-columns:1fr 1fr}.sticky{position:static}}@media(max-width:620px){.container,.nav,.foot{width:calc(100% - 22px)}.nav{height:65px}.navactions .soft{display:none}.hero{padding-top:30px}.hero h1{font-size:47px}.lead{font-size:16px}.feature{min-height:360px}.featureStory{margin-top:90px}.grid{grid-template-columns:1fr}.cats{grid-template-columns:1fr 1fr}.cta{flex-direction:column;align-items:flex-start;padding:27px}.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}.foot{grid-template-columns:1fr}}
</style>
