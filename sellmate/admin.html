<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SELLMATE PH Admin</title><style>body{margin:0;background:#f4f6fa;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033}.wrap{max-width:1100px;margin:auto;padding:20px 14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin-bottom:14px}h1{margin:0 0 6px}input{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;margin-top:6px;box-sizing:border-box}button{border:0;border-radius:9px;padding:10px 14px;font-weight:800;background:#111827;color:#fff;margin:8px 6px 0 0;cursor:pointer}.ok{background:#166534}.bad{background:#991b1b}.muted{color:#667085;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f8fafc;padding:14px;border-radius:12px}.payment{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-top:10px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#f3f4f6;font-size:12px;font-weight:800}.pending{background:#fef3c7}.approved{background:#dcfce7}.rejected{background:#fee2e2}img{max-width:260px;max-height:260px;border-radius:10px;margin-top:8px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><div class="card"><h1>SELLMATE PH Admin</h1><div id="login"><p class="muted">Enter your private admin key.</p><input id="key" type="password" placeholder="Admin key"><button onclick="login()">Login</button><div id="msg"></div></div><div id="app" style="display:none"><button onclick="logout()">Logout</button><div id="stats" class="grid"></div></div></div><div id="settings" class="card" style="display:none"><h2>GCash / Pro Settings</h2><p class="muted">Use the GCash details you are authorized to receive payments with.</p><label>Name / Account name<input id="gcashName"></label><label>GCash number<input id="gcashNumber"></label><label>GCash QR image URL (optional)<input id="gcashQrUrl"></label><label>Pro price (₱)<input id="proPrice" type="number" min="1"></label><label>Customer note<input id="contactNote"></label><button onclick="saveSettings()">Save Settings</button><div id="setmsg"></div></div><div id="payments" class="card" style="display:none"><h2>Payment Review</h2><div id="list"></div></div><script>
const $=id=>document.getElementById(id);async function api(u,o={}){const r=await fetch(u,Object.assign({headers:{"Content-Type":"application/json"}},o));const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Request failed");return j}
async function login(){try{await api("/api/admin/login",{method:"POST",body:JSON.stringify({key:$("key").value})});$("login").style.display="none";$("app").style.display="block";$("settings").style.display="block";$("payments").style.display="block";load()}catch(e){$("msg").textContent=e.message}}
async function logout(){await api("/api/admin/logout",{method:"POST"});location.reload()}
async function load(){const d=await api("/api/admin/dashboard");$("stats").innerHTML="<div class=stat><b>Users</b><br>"+d.users+"</div><div class=stat><b>Payments</b><br>"+d.payments+"</div><div class=stat><b>Pending</b><br>"+d.pending+"</div><div class=stat><b>Approved revenue</b><br>₱"+Math.round(d.revenue).toLocaleString()+"</div>";let s=d.settings;$("gcashName").value=s.gcashName;$("gcashNumber").value=s.gcashNumber;$("gcashQrUrl").value=s.gcashQrUrl;$("proPrice").value=s.proPrice;$("contactNote").value=s.contactNote;const p=await api("/api/admin/payments");$("list").innerHTML=p.payments.length?p.payments.map(x=>'<div class="payment"><span class="pill '+x.status+'">'+x.status.toUpperCase()+'</span><p><b>'+esc(x.email)+'</b> — ₱'+x.amount+'<br>GCash ref: <b>'+esc(x.reference)+'</b><br><span class=muted>'+new Date(x.createdAt).toLocaleString()+'</span></p>'+(x.note?'<p>'+esc(x.note)+'</p>':'')+(x.receiptUrl?'<a href="'+x.receiptUrl+'" target="_blank"><img src="'+x.receiptUrl+'"></a>':'')+(x.status==="pending"?'<div><button class=ok onclick="review(\''+x.id+'\',\'approve\')">Approve & Unlock Pro</button><button class=bad onclick="review(\''+x.id+'\',\'reject\')">Reject</button></div>':'')+'</div>').join(""):'<p class=muted>No payments yet.</p>'}
async function saveSettings(){try{await api("/api/admin/settings",{method:"POST",body:JSON.stringify({gcashName:$("gcashName").value,gcashNumber:$("gcashNumber").value,gcashQrUrl:$("gcashQrUrl").value,proPrice:$("proPrice").value,contactNote:$("contactNote").value})});$("setmsg").textContent="Saved.";load()}catch(e){$("setmsg").textContent=e.message}}
async function review(id,a){if(a==="reject"&&!confirm("Reject this payment?"))return;try{await api("/api/admin/payments/"+id+"/"+a,{method:"POST"});load()}catch(e){alert(e.message)}}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
</script></main></body></html>
