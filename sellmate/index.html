<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SELLMATE PH — Seller Toolkit</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:28px 16px}.hero{background:#111827;color:#fff;border-radius:22px;padding:28px;margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:34px}.hero p{margin:0;color:#d1d5db}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 4px 18px #00000008}label{display:block;font-weight:700;margin:12px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font:inherit}button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;margin:8px 6px 0 0;background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#f8fafc;padding:14px;border-radius:12px}.out{white-space:pre-wrap;background:#f8fafc;padding:16px;border-radius:12px;min-height:100px}@media(max-width:650px){.grid{grid-template-columns:1fr}.hero h1{font-size:28px}}</style></head><body><main class="wrap">
<section class="hero"><h1>SELLMATE PH</h1><p>Simple tools for Filipino online sellers — price, profit, listing and marketing in one place.</p></section>
<section class="card"><h2>💰 Profit Calculator</h2><div class="grid"><div><label>Cost (₱)</label><input id="cost" type="number" value="100"></div><div><label>Selling price (₱)</label><input id="price" type="number" value="199"></div><div><label>Other fees (₱)</label><input id="fees" type="number" value="20"></div></div><button onclick="calc()">Calculate</button><div id="stats" class="grid" style="margin-top:14px"></div></section>
<section class="card"><h2>🛒 Listing Generator</h2><label>Product name</label><input id="product" placeholder="e.g. Stainless tumbler 500ml"><label>Key details</label><textarea id="details" rows="3" placeholder="Leak-proof, reusable, 3 colors..."></textarea><button onclick="generate()">Generate Listing</button><div id="output" class="out" style="margin-top:14px"></div></section>
<section class="card"><h2>📣 Marketing Caption</h2><button class="secondary" onclick="caption()">Create Facebook/TikTok caption</button><div id="caption" class="out" style="margin-top:14px"></div></section>
</main><script>
function money(n){return "₱"+Math.round(n).toLocaleString("en-PH")}
function calc(){let c=+cost.value||0,p=+price.value||0,f=+fees.value||0,profit=p-c-f,margin=p?profit/p*100:0;stats.innerHTML='<div class="stat"><b>Profit</b><br>'+money(profit)+'</div><div class="stat"><b>Margin</b><br>'+margin.toFixed(1)+'%</div><div class="stat"><b>Markup</b><br>'+ (c?((p-c)/c*100).toFixed(1):0)+'%</div>'}
function generate(){let p=product.value.trim()||"Your Product",d=details.value.trim()||"Quality product at a great price";output.textContent=p+" | Affordable & Practical\n\n"+d+"\n\n✨ Great for everyday use\n📦 Ready for shipping\n💬 Message us to order\n\n#OnlineSeller #BudolFinds #SulitFinds"}
function caption(){let p=product.value.trim()||"this product";captionEl=document.getElementById("caption");captionEl.textContent="🔥 Looking for "+p+"?\n\nSulit, practical, and ready to order! Send us a message and grab yours today. 🛒✨\n\n#BudolFinds #OnlineShopping #SmallBusinessPH"}
calc()</script></body></html>
