name: TINTA Quick Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tinta-webview-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Create lightweight TINTA Android app
        run: |
          mkdir -p quickapp/app/src/main/java/com/tinta/app
          mkdir -p quickapp/app/src/main/res/drawable
          mkdir -p quickapp/app/src/main/res/values
          cat > quickapp/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='TINTAQuick'
          include ':app'
          EOF
          cat > quickapp/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > quickapp/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.tinta.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.tinta.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                  }
              }
          }
          EOF
          cat > quickapp/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">TINTA</string></resources>
          EOF
          cat > quickapp/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#E50914</item>
              <item name="android:statusBarColor">#000000</item>
              <item name="android:navigationBarColor">#000000</item>
              <item name="android:windowLightStatusBar">false</item>
            </style>
          </resources>
          EOF
          cat > quickapp/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
              android:theme="@style/AppTheme"
              android:label="TINTA"
              android:icon="@drawable/icon"
              android:usesCleartextTraffic="false"
              android:hardwareAccelerated="true"
              android:resizeableActivity="true">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:screenOrientation="portrait">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > quickapp/app/src/main/java/com/tinta/app/MainActivity.java <<'EOF'
          package com.tinta.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private static final int FILE_PICKER = 7001;
              private ValueCallback<Uri[]> fileCallback;
              private WebView web;

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(true);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          fileCallback = cb;
                          Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*");
                          startActivityForResult(intent, FILE_PICKER);
                          return true;
                      }
                  });
                  setContentView(web);
                  web.loadUrl("https://tinta-emergent-1.onrender.com");
              }

              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != FILE_PICKER || fileCallback == null) return;
                  Uri[] results = null;
                  if (resultCode == RESULT_OK && data != null && data.getData() != null) {
                      results = new Uri[]{data.getData()};
                  }
                  fileCallback.onReceiveValue(results);
                  fileCallback = null;
              }

              @Override public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          EOF
          convert -size 1024x1024 xc:black -fill white -font DejaVu-Sans-Bold -pointsize 180 -gravity center -annotate +0+0 'TINTA' quickapp/app/src/main/res/drawable/icon.png

      - name: Build TINTA APK
        working-directory: quickapp
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew --no-daemon assembleRelease

      - name: Verify APK
        run: |
          test -s quickapp/app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose quickapp/app/build/outputs/apk/release/app-release.apk

      - name: Upload TINTA APK
        uses: actions/upload-artifact@v4
        with:
          name: TINTA-webview-release-apk
          path: quickapp/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download TINTA APK
        uses: actions/download-artifact@v4
        with:
          name: TINTA-webview-release-apk
          path: apk

      - name: Smoke test TINTA WebView APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r apk/app-release.apk
            adb logcat -c
            adb shell monkey -p com.tinta.app 1
            sleep 12
            adb shell dumpsys activity activities > /tmp/tinta-activity.txt
            adb logcat -d -v threadtime > /tmp/tinta-logcat.txt
            cat /tmp/tinta-activity.txt
            cat /tmp/tinta-logcat.txt
            if grep -Eiq "FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com.tinta.app" /tmp/tinta-logcat.txt; then
              exit 1
            fi
            if ! grep -q "com.tinta.app" /tmp/tinta-activity.txt; then
              exit 1
            fi
