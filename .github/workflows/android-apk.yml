name: TINTA Native Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend/**'
      - 'android/**'
      - '.github/workflows/android-apk.yml'

env:
  # Most current Android phones use ARM64. Limiting the native build to this
  # ABI prevents the GitHub runner from compiling four large native variants.
  ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Generate native Android project
        working-directory: frontend
        env:
          CI: '1'
        run: npx expo prebuild --platform android

      - name: Build native TINTA APK
        working-directory: frontend/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK exists
        run: test -s frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload TINTA native APK
        uses: actions/upload-artifact@v4
        with:
          name: TINTA-native-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
