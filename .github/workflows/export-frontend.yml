name: Export TINTA frontend manifest

on:
  push:
    branches:
      - vercel-frontend
    paths-ignore:
      - frontend-manifest.json

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vercel-frontend
      - name: Build source manifest
        run: |
          python - <<'PY'
          import base64, json
          from pathlib import Path
          root = Path("frontend")
          manifest = {"version": 1, "files": []}
          for p in sorted(root.rglob("*")):
              if not p.is_file():
                  continue
              if any(part in {".git", "node_modules", "dist", ".expo"} for part in p.parts):
                  continue
              data = p.read_bytes()
              manifest["files"].append({
                  "file": p.as_posix(),
                  "data_b64": base64.b64encode(data).decode("ascii"),
              })
          Path("frontend-manifest.json").write_text(json.dumps(manifest, separators=(",", ":")), encoding="utf-8")
          print(f"Exported {len(manifest['files'])} frontend files")
          PY
      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Export frontend source manifest for Vercel"
          git push origin vercel-frontend
